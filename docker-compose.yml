services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha-quant-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - alpha-quant-network

  db:
    image: postgres:15-alpine
    container_name: alpha-quant-db
    environment:
      - POSTGRES_DB=alpha_quant_trader_pro
      - POSTGRES_USER=alpha_quant_trader_pro
      - POSTGRES_PASSWORD=alpha_quant_trader_pro
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha_quant_trader_pro"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alpha-quant-network

  redis:
    image: redis:7-alpine
    container_name: alpha-quant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alpha-quant-network

volumes:
  db_data:
  redis_data:

networks:
  alpha-quant-network:
    driver: bridge