# 模拟交易策略配置

strategies:
  aggressive:  # 激进型
    name: "激进型"
    description: "高仓位追涨杀跌，短线为主"
    enabled: true
    initial_cash: 80000
    max_position: 0.9
    min_position: 0.5
    stop_loss: -0.08
    take_profit: 0.15
    trade_ratio: 0.5
    chase_threshold: 0.05
    cut_loss_threshold: -0.03

  moderate:  # 稳健型
    name: "稳健型"
    description: "中等仓位趋势跟踪，波段操作"
    enabled: true
    initial_cash: 60000
    max_position: 0.7
    min_position: 0.3
    stop_loss: -0.05
    take_profit: 0.10
    trade_ratio: 0.3
    trend_follow_days: 5

  conservative:  # 保守型
    name: "保守型"
    description: "低仓位价值投资，长期持有"
    enabled: true
    initial_cash: 50000
    max_position: 0.5
    min_position: 0.2
    stop_loss: -0.03
    take_profit: 0.08
    trade_ratio: 0.2
    value_threshold: 0.15
