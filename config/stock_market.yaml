# ==================== 股票市场配置 ====================
stock_market:
  # 数据同步配置
  sync:
    # 是否启用增量同步
    incremental: true

    # 最大并发数
    # 同时同步的股票数量
    # 范围: 1-100
    concurrency: 10

    # K线工作线程数
    # 专用的 K 线数据同步并发数
    # 范围: 1-20
    kline_workers: 5

    # 重试次数
    # 同步失败时的重试次数
    # 范围: 0-10
    retry_times: 3

    # 重试延迟（秒）
    # 每次重试之间的延迟
    # 范围: 0.0-60.0
    retry_delay: 1.0

  # 数据保留策略
  data_retention:
    # K线数据保留天数
    # 范围: 1-3650 (约10年)
    kline_days: 365

    # 基本面数据保留天数
    # 范围: 1-3650 (约10年)
    fundamentals_days: 730  # 2年

  # 市场交易时间
  trading_hours:
    # A股开盘时间（上午）
    morning_open: "09:30"

    # A股收盘时间（上午）
    morning_close: "11:30"

    # A股开盘时间（下午）
    afternoon_open: "13:00"

    # A股收盘时间（下午）
    afternoon_close: "15:00"
