# 统一配置文件
# Unified configuration file
# 
# 注意：敏感配置（如数据库URL）应通过环境变量设置
# 请参考 .env.example 了解如何配置环境变量

app:
  name: "alpha-quant-trader-pro"
  debug: false
  environment: "development"
  timezone: "Asia/Shanghai"

# 数据库配置 - 敏感信息通过环境变量设置
database:
  url: ""
  pool_size: 10
  max_overflow: 20
  pool_pre_ping: true
  pool_recycle: 3600
  connect_timeout: 30

# 其他配置引用各个独立配置文件
