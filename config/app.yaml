# ==================== 应用配置 ====================
app:
  # 应用名称
  name: "alpha-quant-trader-pro"

  # 调试模式
  # true: 启用详细日志、开发工具
  # false: 生产环境，性能优化
  debug: false

  # 运行环境
  # development: 开发环境
  # testing: 测试环境
  # staging: 预发布环境
  # production: 生产环境
  environment: "development"

  # 时区设置
  timezone: "Asia/Shanghai"