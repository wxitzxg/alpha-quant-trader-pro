# ==================== 手续费配置 ====================
fee:
  # 印花税
  # 卖出时收取，买入不收
  # 范围: 0-1
  stamp_duty: 0.001  # 0.1%

  # 交易所费用
  # 买卖双向收取
  # 范围: 0-1
  exchange_fee: 0.00002  # 0.002%

  # 券商佣金
  # 买卖双向收取
  # 范围: 0-1
  broker_commission: 0.0003  # 0.03%

  # 最低佣金
  # 单笔交易佣金低于此值时，按此值收取
  # 范围: >= 0
  min_commission: 5.0  # 5元