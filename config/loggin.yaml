# ==================== 日志配置 ====================
logging:
  # 日志级别
  # DEBUG: 详细调试信息
  # INFO: 一般信息
  # WARNING: 警告信息
  # ERROR: 错误信息
  # CRITICAL: 严重错误
  level: "INFO"

  # 日志格式
  # %(asctime)s: 时间戳
  # %(name)s: 记录器名称
  # %(levelname)s: 日志级别
  # %(message)s: 日志消息
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 日志文件路径（可选）
  # 留空则输出到控制台
  file_path: ""

  # 日志文件大小限制（MB）
  # 范围: >= 1
  max_file_size: 100

  # 保留的旧日志文件数量
  # 范围: >= 0
  backup_count: 5